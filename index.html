<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uçak Limitleri</title>
    <style>
        * { box-sizing: border-box; }
        :root { --bg-color: #f0f4f8; --container-bg: #ffffff; --text-color: #1a202c; --primary-color: #0b3c5d; --accent-color: #328cc1; --btn-bg: #f7fafc; --btn-border: #e2e8f0; --btn-text: #4a5568; }
        [data-theme="exam"] { --bg-color: #1a202c; --container-bg: #2d3748; --text-color: #edf2f7; --primary-color: #90cdf4; --accent-color: #4299e1; --btn-bg: #4a5568; --btn-border: #718096; --btn-text: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; transition: all 0.3s ease; }
        .quiz-container { background-color: var(--container-bg); border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); padding: 25px; max-width: 550px; width: 100%; position: relative; }
        .top-buttons { position: absolute; top: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
        .theme-switch, .share-btn, .home-btn { background: var(--accent-color); color: white; border: none; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        .share-btn { background: #2f855a; }
        .home-btn { background: #4a5568; }
        .header { text-align: center; margin-bottom: 20px; padding-top: 25px; }
        .header h1 { color: var(--primary-color); font-size: 1.5rem; margin: 0 0 5px 0; }
        .progress-bar { height: 6px; background-color: #e2e8f0; border-radius: 3px; margin-bottom: 25px; overflow: hidden; display: none;}
        .progress-fill { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.3s ease; }
        .options { display: flex; flex-wrap: wrap; gap: 12px; flex-direction: column; }
        .btn { background-color: var(--btn-bg); border: 2px solid var(--btn-border); padding: 14px 18px; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 500; text-align: left; color: var(--btn-text); transition: all 0.2s ease; }
        .aircraft-btn { background-color: #e3fafc; border-color: #99e9f2; color: #0c8599; text-align: center; font-weight: 600;}
        .subcat-btn { background-color: #fff9db; border-color: #ffe066; color: #f08c00; text-align: center; font-weight: 600; }
        .nav-controls { display: flex; gap: 10px; margin-top: 20px; }
        .nav-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; text-align: center; font-size: 0.95rem; }
        .matrix-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 25px; padding-top: 15px; border-top: 1px solid #e2e8f0; justify-content: center; }
        .matrix-box { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #cbd5e0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; cursor: pointer; background-color: white; color: #1a202c; }
        .matrix-box.active { border: 2px solid var(--accent-color); transform: scale(1.1); }
        .input-control { padding: 14px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 1rem; width: 100%; background: white; margin-bottom:10px; }
        .input-btn { background-color: var(--primary-color); color: white; border: none; font-weight: bold; cursor: pointer; width: 100%; padding:14px; border-radius:10px; }
    </style>
</head>
<body>
<div class="quiz-container">
    <div class="top-buttons">
        <button class="home-btn" onclick="backToMenu()">Ana Sayfa 🏠</button>
        <button class="theme-switch" onclick="toggleTheme()" id="theme-toggle-btn">Koyu Mod 🌙</button>
    </div>
    <div class="header">
        <h1 id="main-title">Uçak Limitleri ✈️</h1>
        <p id="question-counter">Sistem Başlatılıyor...</p>
    </div>
    
    <div class="progress-bar" id="progress-bar-container"><div class="progress-fill" id="progress-fill"></div></div>
    
    <div id="login-screen" style="display: none;">
        <input type="text" id="username-input" class="input-control" placeholder="Adınız">
        <input type="text" id="usersurname-input" class="input-control" placeholder="Soyadınız">
        <select id="usergender-input" class="input-control"><option value="">Cinsiyet Seçiniz...</option><option value="Erkek">Erkek</option><option value="Kadın">Kadın</option></select>
        <button class="input-btn" onclick="saveUser()">Sınav Sistemine Giriş Yap</button>
    </div>

    <div id="aircraft-selector" style="display: none;">
        <div id="welcome-msg" class="user-welcome"></div>
        <div class="options">
            <button class="btn aircraft-btn" onclick="showSubCategories('Aquila A211')">Aquila A211</button>
            <button class="btn aircraft-btn" onclick="showSubCategories('Diamond DA20 Eclipse')">Diamond DA20 Eclipse</button>
            <button class="btn aircraft-btn" onclick="showSubCategories('Diamond DA40 NG')">Diamond DA40 NG</button>
            <button class="btn aircraft-btn" onclick="showSubCategories('Diamond DA42 NG')">Diamond DA42 NG</button>
        </div>
    </div>

    <div id="subcategory-selector" style="display: none;">
        <div id="subcategory-welcome-title" class="user-welcome" style="font-weight:700; color:var(--primary-color);">Sınav Bölümü Seçiniz</div>
        <div class="options" id="subcategory-buttons-container"></div>
    </div>

    <div id="quiz-body" style="display: none;">
        <div class="question" id="question-text"></div>
        <div id="options-container" class="options"></div>
        <div id="explanation-box" class="explanation"></div>
        <div class="nav-controls">
            <button class="nav-btn prev-style" onclick="prevQuestion()">Önceki</button>
            <button class="nav-btn next-style" id="next-btn" onclick="handleNextOrFinish()">Sonraki</button>
        </div>
        <div class="matrix-container" id="matrix-container"></div>
    </div>

    <div id="result-body" class="score-container" style="display: none;">
        <div class="score-title">Sınav Raporu 📋</div>
        <div class="score-number"><span id="score">0</span> / <span id="total">0</span></div>
        <button class="restart-btn" onclick="backToMenu()">Ana Menüye Dön</button>
    </div>
</div>

<script>
    const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbycVvWk13aBgh6a--r3iBKq4ykoGxfktmCrrGO7_LKcp03Dff4qyEXdjmMDuen8nxwz/exec";
    
    let allQuestions = [];
    let activeQuestions = [];
    let currentQuestionIndex = 0;
    let selectedCategory = "";
    let selectedAircraft = ""; 
    let questionStates = [];

    window.onload = async function() {
        try {
            const response = await fetch(GOOGLE_SHEETS_URL);
            allQuestions = await response.json();
            document.getElementById('question-counter').innerText = "Veritabanı Hazır!";
            if (localStorage.getItem('p_name')) showMainMenu(); else showLoginScreen();
        } catch (e) { document.getElementById('question-counter').innerText = "Hata! Sayfayı yenileyin."; }
    };

    function showLoginScreen() {
        document.getElementById('login-screen').style.display = 'block';
    }

    function saveUser() {
        localStorage.setItem('p_name', document.getElementById('username-input').value);
        showMainMenu();
    }

    function showMainMenu() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('aircraft-selector').style.display = 'block';
        document.getElementById('quiz-body').style.display = 'none';
        document.getElementById('subcategory-selector').style.display = 'none';
    }

    // 1. KADEME: ANA KATEGORİLER
    function showSubCategories(aircraftName) {
        selectedAircraft = aircraftName;
        document.getElementById('aircraft-selector').style.display = 'none';
        document.getElementById('subcategory-selector').style.display = 'block';
        
        const title = document.getElementById('subcategory-welcome-title');
        title.innerText = `${selectedAircraft} - Ana Kategori Seçiniz`;
        const container = document.getElementById('subcategory-buttons-container');
        container.innerHTML = '';
    
        const aircraftQuestions = allQuestions.filter(q => q.ucak_tipi === selectedAircraft);
        // " - " ile ayrılmış ana kategorileri al
        const mainCategories = [...new Set(aircraftQuestions.map(q => (q.cat || 'Genel').split(' - ')[0].trim()))];
    
        mainCategories.forEach(mainCat => {
            const btn = document.createElement('button');
            btn.className = "btn subcat-btn";
            btn.innerText = mainCat;
            btn.onclick = () => showSubCategoriesLevel2(mainCat, aircraftQuestions);
            container.appendChild(btn);
        });
    
        const backBtn = document.createElement('button');
        backBtn.className = "btn prev-style";
        backBtn.innerText = "↩ Geri Dön";
        backBtn.onclick = showMainMenu;
        container.appendChild(backBtn);
    }
    
    // 2. KADEME: ALT KATEGORİLER
    function showSubCategoriesLevel2(mainCat, allAircraftQuestions) {
        const container = document.getElementById('subcategory-buttons-container');
        const title = document.getElementById('subcategory-welcome-title');
        title.innerText = `${mainCat} - Alt Kategori Seçiniz`;
        container.innerHTML = '';
    
        // Seçilen ana kategoriye ait alt kategorileri listele
        const subCategories = [...new Set(allAircraftQuestions
            .filter(q => (q.cat || 'Genel').startsWith(mainCat))
            .map(q => (q.cat || 'Genel').split(' - ')[1] || "Genel Bilgiler"))];
    
        subCategories.forEach(subCat => {
            const btn = document.createElement('button');
            btn.className = "btn subcat-btn";
            btn.style.backgroundColor = "#e3fafc";
            btn.innerText = subCat;
            const fullCatName = `${mainCat} - ${subCat}`;
            btn.onclick = () => startQuiz(fullCatName);
            container.appendChild(btn);
        });
    
        const backBtn = document.createElement('button');
        backBtn.className = "btn prev-style";
        backBtn.innerText = "↩ Ana Kategorilere Dön";
        backBtn.onclick = () => showSubCategories(selectedAircraft);
        container.appendChild(backBtn);
    }
    
    function startQuiz(categoryName) {
        selectedCategory = categoryName;
        activeQuestions = allQuestions.filter(q => q.ucak_tipi === selectedAircraft && q.cat === categoryName);
        questionStates = activeQuestions.map(() => ({ status: 'unanswered', userA: '' }));
        currentQuestionIndex = 0;
        
        document.getElementById('subcategory-selector').style.display = 'none';
        document.getElementById('quiz-body').style.display = 'block';
        document.getElementById('progress-bar-container').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        let q = activeQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerHTML = q.soru;
        document.getElementById('options-container').innerHTML = '';
        q.secenekler.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => alert(opt === q.cevap ? "Doğru" : "Yanlış");
            document.getElementById('options-container').appendChild(btn);
        });
    }

    function handleNextOrFinish() {
        if(currentQuestionIndex < activeQuestions.length - 1) { currentQuestionIndex++; loadQuestion(); }
        else showResult();
    }

    function showResult() {
        document.getElementById('quiz-body').style.display = 'none';
        document.getElementById('result-body').style.display = 'block';
    }

    function toggleTheme() {
        const theme = document.documentElement.getAttribute('data-theme') === 'exam' ? '' : 'exam';
        document.documentElement.setAttribute('data-theme', theme);
    }
    
    function backToMenu() { location.reload(); }
</script>
</body>
</html>
