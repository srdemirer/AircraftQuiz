<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uçak Limitleri</title>
    <style>
        /* Tasarım kodların aynı şekilde korunmuştur */
        * { box-sizing: border-box; }
        :root { --bg-color: #f0f4f8; --container-bg: #ffffff; --text-color: #1a202c; --primary-color: #0b3c5d; --accent-color: #328cc1; --btn-bg: #f7fafc; --btn-border: #e2e8f0; --btn-text: #4a5568; }
        [data-theme="exam"] { --bg-color: #1a202c; --container-bg: #2d3748; --text-color: #edf2f7; --primary-color: #90cdf4; --accent-color: #4299e1; --btn-bg: #4a5568; --btn-border: #718096; --btn-text: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; transition: all 0.3s ease; }
        .quiz-container { background-color: var(--container-bg); border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); padding: 25px; max-width: 550px; width: 100%; position: relative; }
        .top-buttons { position: absolute; top: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .theme-switch, .share-btn, .home-btn, .logout-btn { background: var(--accent-color); color: white; border: none; padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }
        .share-btn { background: #2f855a; }
        .home-btn { background: #4a5568; }
        .logout-btn { background: #e53e3e; }
        .header { text-align: center; margin-bottom: 20px; padding-top: 35px; }
        .header h1 { color: var(--primary-color); font-size: 1.5rem; margin: 0 0 5px 0; }
        .timer-badge { font-size: 1.1rem; font-weight: 800; color: #e53e3e; background: #fff5f5; padding: 4px 12px; border-radius: 8px; border: 2px solid #fed7d7; display: inline-block; margin-top: 5px; }
        .progress-bar { height: 6px; background-color: #e2e8f0; border-radius: 3px; margin-bottom: 25px; overflow: hidden; display: none;}
        .progress-fill { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.3s ease; }
        .btn { background-color: var(--btn-bg); border: 2px solid var(--btn-border); padding: 14px 18px; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 500; text-align: left; color: var(--btn-text); transition: all 0.2s ease; display: block; width: 100%; margin-bottom: 10px; }
        .correct { background-color: #c6f6d5 !important; border-color: #48bb78 !important; color: #22543d !important; }
        .wrong { background-color: #fed7d7 !important; border-color: #f56565 !important; color: #742a2a !important; }
        .explanation { margin-top: 20px; padding: 15px; background-color: #ebf8ff; border-left: 4px solid #3182ce; border-radius: 4px; font-size: 0.95rem; color: #2b6cb0; display: none; }
        .nav-controls { display: flex; gap: 10px; margin-top: 20px; }
        .nav-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .matrix-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 25px; padding-top: 15px; border-top: 1px solid #e2e8f0; justify-content: center; }
        .matrix-box { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #cbd5e0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; }
        .matrix-box.active { border: 2px solid var(--accent-color); }
        .matrix-box.m-correct { background-color: #48bb78; color: white; }
        .matrix-box.m-wrong { background-color: #f56565; color: white; }
        .cert-btn { background-color: #2b6cb0; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; width: 100%; display: none; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="top-buttons">
        <button class="home-btn" onclick="backToMenu()">🏠</button>
        <button class="share-btn" onclick="shareSystem()">🔗</button>
        <button class="theme-switch" id="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
        <button class="logout-btn" onclick="logout()">Çıkış 🚪</button>
    </div>

    <div class="header">
        <h1 id="main-title">Uçak Limitleri ✈️</h1>
        <p id="question-counter">Sistem Başlatılıyor...</p>
        <div id="quiz-timer" class="timer-badge" style="display: none;">00:00</div>
    </div>

    <div class="progress-bar" id="progress-bar-container"><div class="progress-fill" id="progress-fill"></div></div>
    
    <div id="login-screen">
        <input type="text" id="username-input" class="btn" placeholder="Adınız">
        <input type="text" id="usersurname-input" class="btn" placeholder="Soyadınız">
        <button class="btn" style="background:var(--primary-color); color:white; text-align:center;" onclick="saveUser()">Giriş Yap</button>
    </div>

    <div id="aircraft-selector" style="display: none;">
        <div class="options" id="aircraft-container">
            <button class="btn" onclick="showSubCategories('Aquila A211')">Aquila A211</button>
            <button class="btn" onclick="showSubCategories('Diamond DA20 Eclipse')">Diamond DA20 Eclipse</button>
            <button class="btn" onclick="showSubCategories('Diamond DA40 NG')">Diamond DA40 NG</button>
        </div>
    </div>

    <div id="subcategory-selector" style="display: none;">
        <div class="options" id="subcategory-buttons-container"></div>
    </div>

    <div id="quiz-body" style="display: none;">
        <div class="question" id="question-text" style="font-weight:600; margin-bottom:20px;"></div>
        <div id="options-container"></div>
        <div class="explanation" id="explanation-box"></div>
        <div class="nav-controls">
            <button class="nav-btn" onclick="handleNextOrFinish()" id="next-btn">Sonraki</button>
        </div>
        <div class="matrix-container" id="matrix-container"></div>
    </div>

    <div id="result-body" style="display: none; text-align:center;">
        <div id="score-text" style="font-size:2rem; font-weight:bold; margin:20px 0;"></div>
        <button class="cert-btn" id="cert-download-btn" onclick="generateCertificate()">🎖️ Başarı Sertifikasını İndir</button>
        <button class="btn" onclick="backToMenu()">Ana Menüye Dön</button>
    </div>
</div>

<script>
    const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbycVvWk13aBgh6a--r3iBKq4ykoGxfktmCrrGO7_LKcp03Dff4qyEXdjmMDuen8nxwz/exec";
    let allQuestions = [], activeQuestions = [], currentQuestionIndex = 0, questionStates = [];

    window.onload = async () => {
        const res = await fetch(GOOGLE_SHEETS_URL);
        allQuestions = await res.json();
        if(localStorage.getItem('p_name')) showAircraftSelector();
    };

    function saveUser() {
        localStorage.setItem('p_name', document.getElementById('username-input').value);
        localStorage.setItem('p_surname', document.getElementById('usersurname-input').value);
        showAircraftSelector();
    }

    function logout() {
        if(confirm("Çıkış yapmak istiyor musunuz?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function showAircraftSelector() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('aircraft-selector').style.display = 'block';
    }

    function showSubCategories(ac) {
        document.getElementById('aircraft-selector').style.display = 'none';
        const container = document.getElementById('subcategory-buttons-container');
        container.innerHTML = '';
        let cats = [...new Set(allQuestions.filter(q => q.ucak_tipi === ac).map(q => q.cat))];
        cats.forEach(c => {
            let b = document.createElement('button');
            b.className = 'btn';
            b.innerText = c;
            b.onclick = () => startQuiz(ac, c);
            container.appendChild(b);
        });
        document.getElementById('subcategory-selector').style.display = 'block';
    }

    function startQuiz(ac, cat) {
        activeQuestions = allQuestions.filter(q => q.ucak_tipi === ac && q.cat === cat);
        questionStates = activeQuestions.map(() => ({ status: 'unanswered', userA: '' }));
        currentQuestionIndex = 0;
        document.getElementById('subcategory-selector').style.display = 'none';
        document.getElementById('quiz-body').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        let q = activeQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = q.soru;
        const optCont = document.getElementById('options-container');
        optCont.innerHTML = '';
        q.secenekler.forEach(opt => {
            let b = document.createElement('button');
            b.className = 'btn';
            b.innerText = opt;
            b.onclick = () => {
                let isCorrect = (opt === q.cevap);
                questionStates[currentQuestionIndex].status = isCorrect ? 'correct' : 'wrong';
                b.classList.add(isCorrect ? 'correct' : 'wrong');
                document.getElementById('explanation-box').innerHTML = q.aciklama;
                document.getElementById('explanation-box').style.display = 'block';
            };
            optCont.appendChild(b);
        });
    }

    function handleNextOrFinish() {
        if(currentQuestionIndex < activeQuestions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        let correct = questionStates.filter(s => s.status === 'correct').length;
        let pct = Math.round((correct / activeQuestions.length) * 100);
        document.getElementById('quiz-body').style.display = 'none';
        document.getElementById('result-body').style.display = 'block';
        document.getElementById('score-text').innerText = `%${pct} Başarı`;
        
        // Sertifika mantığı: Her kategoride %75 üstü için
        if(pct >= 75) {
            document.getElementById('cert-download-btn').style.display = 'block';
        }
    }

    function backToMenu() { location.reload(); }
    function toggleTheme() { document.documentElement.toggleAttribute('data-theme', document.documentElement.getAttribute('data-theme') !== 'exam'); }
    function shareSystem() { alert("Link kopyalandı!"); }
    
    // Basit Sertifika Çizimi
    function generateCertificate() {
        const canvas = document.createElement('canvas');
        canvas.width = 600; canvas.height = 400;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0b3c5d'; ctx.fillRect(0,0,600,400);
        ctx.fillStyle = 'white'; ctx.font = '30px Arial';
        ctx.fillText('BAŞARI SERTİFİKASI', 150, 100);
        ctx.font = '20px Arial';
        ctx.fillText(localStorage.getItem('p_name') + ' ' + localStorage.getItem('p_surname'), 200, 200);
        const link = document.createElement('a');
        link.download = 'Sertifika.png'; link.href = canvas.toDataURL(); link.click();
    }
</script>
</body>
</html>
